name: Сообщить об ошибке / Bug report
description: Сообщите о воспроизводимой ошибке и помогите найти ее причину.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Проблемы установки и настройки также можно найти в [Используйте вопрос и ответ](https://github.com/KKKKhazix/agent-autoloop/discussions/categories/q-a) Связь.
        Для вопросов безопасности нажмите [Инструкции по безопасности](https://github.com/KKKKhazix/agent-autoloop/blob/main/SECURITY.md) Свяжитесь с сопровождающим.
        Не загружайте ключи, ссылки на карты с разрешениями, полные конфигурации, базы данных или реальную деловую информацию.
  - type: input
    id: version
    attributes:
      label: версия программы
      description: Заполните agent-autoloop --version вывод команды и дата установки или обновления; при запуске из исходников приложите хеш коммита.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Среда выполнения
      description: система,Node.js версия и связанные Agent Или подключаемый модуль, и локальная машина, или удаленный прием заказов.
      placeholder: macOS / Linux；node --version；Agent Название и версия; связанные каналы.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Этапы воспроизведения
      description: Укажите минимальные шаги воспроизведения; в примерах правил используйте вымышленные данные и заполнители.
      placeholder: |
        1. Настройте...
        2. Выполнить...
        3. Кажется...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Ожидаемый и фактический результат
      placeholder: Ожидалось...; фактически...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Журнал или снимок экрана (необязательно)
      description: Можно прикрепить doctor、status или why соответствующие фрагменты; предварительно удалите персональные данные, бизнес-тексты и учетные данные.
