name: Функциональные предложения / Feature request
description: Предложите функцию или улучшение с конкретным сценарием использования.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Идеи на стадии исследования можно обсудить в [Обмен идеями](https://github.com/KKKKhazix/agent-autoloop/discussions/categories/ideas) обсуждении.
        новый Agent、Источники и каналы подключаются через плагины; у ядра нет зависимостей времени выполнения, интерфейсы создаются отдельными клиентами.
  - type: textarea
    id: problem
    attributes:
      label: Сценарии использования и возникающие проблемы
      description: Кому и в какой ситуации нужна эта функция? Что сейчас неудобно?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Как улучшить
      description: Опишите ожидаемое поведение или результат. Можно привести пример.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Испытанные способы (необязательно)
      description: Почему существующие правила, плагины или сценарии не решают задачу?
