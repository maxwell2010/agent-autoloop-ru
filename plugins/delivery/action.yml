name: Определить, публиковать ли на этот раз
description: Сравнить рабочую версию с целевым коммитом; сохранить сведения о еще не опубликованных изменениях кода
inputs:
  target:
    description: Полный хеш публикуемого коммита; по умолчанию github.sha
    required: false
  test-local-health:
    description: Разрешено использовать только для тестирования, проверки работоспособности. http://127.0.0.1
    default: "false"
outputs:
  release:
    description: Нужен ли выпуск
    value: ${{ steps.scope.outputs.release }}
  superseded:
    description: обновленный main содержит ли история изменения кода, требующие отдельного выпуска
    value: ${{ steps.scope.outputs.superseded }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
    - id: scope
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_TEST_LOCAL_HEALTH: ${{ inputs.test-local-health }}
      run: node --disable-warning=ExperimentalWarning "$GITHUB_ACTION_PATH/action.ts"
